name: Isolated software tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: AIOT/server/package-lock.json
      - run: python -m pip install -r tools/requirements-test.txt
      - run: python -m pip check
      - run: python tools/check_python_environment.py
      - run: npm ci --prefix AIOT/server
      - run: python tools/rpi_release.py git-readiness
      - run: python -m unittest discover -s tools/tests -v
      - run: npm test --prefix AIOT/server
      - run: node tools/smoke_aiot_api.mjs --outbox-python python --event-python python --gallery-python python
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: AIOT/server
      - run: npm run test:browser --prefix AIOT/server
      - run: python tools/check_deployment_doc.py
      - run: python tools/check_software.py
      - run: python tools/rpi_release.py build "${{ runner.temp }}/attendance-source.tar.gz"
      - run: python tools/rpi_release.py verify "${{ runner.temp }}/attendance-source.tar.gz"
