<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none" role="img" aria-label="YIRLoDT Logo">
  <defs>
    <linearGradient id="yirBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D3032" />
      <stop offset="48%" stop-color="#E0523A" />
      <stop offset="100%" stop-color="#F1934D" />
    </linearGradient>
    <linearGradient id="yirDotGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0523A" />
      <stop offset="100%" stop-color="#F1934D" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem (Hexagonal tech node) -->
  <g transform="translate(6, 12)">
    <polygon points="22,2 40,12 40,34 22,44 4,34 4,12" stroke="url(#yirBrandGrad)" stroke-width="2.5" fill="none" />
    <circle cx="22" cy="23" r="5.5" fill="url(#yirDotGrad)" />
    <line x1="22" y1="2" x2="22" y2="12" stroke="#E0523A" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="34" x2="14" y2="29" stroke="#E0523A" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="34" x2="30" y2="29" stroke="#F1934D" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wordmark: YIRLoDT -->
  <text x="62" y="38" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.03em" fill="url(#yirBrandGrad)">
    YIR<tspan fill="#F1934D">L</tspan><tspan font-size="23" font-weight="800" dy="-2">o</tspan><tspan dy="2" font-weight="900">DT</tspan>
  </text>

  <!-- Subtitle: PTIT Research Lab -->
  <text x="63" y="52" font-family="'DM Mono', Consolas, monospace" font-size="7.5" font-weight="600" letter-spacing="0.16em" fill="currentColor" opacity="0.8">
    RESEARCH LAB ON DIGITAL TECH · PTIT
  </text>
</svg>
